<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Std 8 Science Tests</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<div id="app"><div class="wrap narrow"><div class="hero"><div class="logo">🔬</div><p class="muted">Loading…</p></div></div></div>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
"use strict";
const TOKEN="q8_token", OUTBOX="q8_outbox";
const S={token:ls.get(TOKEN,null),student:null,title:"Std 8 Science",papers:[],info:null,tab:"login",view:"login",
  paper:null,qs:[],att:null,deadline:0,timer:null,result:null,onlyWrong:false,err:""};

/* ---------- local progress (survives refresh / closing the tab) ---------- */
const fmtN=x=>{x=Math.round(x*100)/100;return x<0?"−"+(-x):String(x);};
const negOf=p=>Number(p&&p.neg)||0;
const markTag=p=>negOf(p)?`+1 / −${negOf(p)}`:"1 mark";
const progKey=pid=>"q8_prog_"+(S.student?S.student.id:"")+"_"+pid;
function prog(){return ls.get(progKey(S.paper.id),null);}
function saveProg(p){ls.set(progKey(S.paper.id),p);}

/* ---------- start-up ---------- */
async function boot(){
  if(S.token){try{await loadHome();flushOutbox();return;}catch(e){if(e.server){ls.del(TOKEN);S.token=null;}else{S.err=e.message;}}}
  await showLogin();
}
async function showLogin(){
  S.view="login";
  if(!S.info){try{S.info=await api("info");if(S.info.title)S.title=S.info.title;}catch(e){S.err=e.message;S.info=null;}}
  render();
}
async function loadHome(){
  const r=await api("home",{token:S.token});
  S.student=r.student;S.papers=r.papers;S.title=r.title||S.title;S.view="home";S.err="";render();
}

/* ---------- views ---------- */
function header(){
  return `<header class="top"><div class="brand">🔬 ${esc(S.title)}</div>
  <div class="who"><span>👤 ${esc(S.student.name)} · ${esc(S.student.cls)}-${esc(S.student.roll)}</span>
  ${S.view!=="home"?`<button class="btn ghost sm" onclick="goHome()">My papers</button>`:""}
  <button class="btn ghost sm" onclick="logout()">Log out</button></div></header>`;
}
function clsField(id){
  const c=S.info&&S.info.classes||[];
  return c.length?`<select id="${id}"><option value="">Choose…</option>${c.map(x=>`<option>${esc(x)}</option>`).join("")}</select>`
    :`<input type="text" id="${id}" maxlength="10" placeholder="e.g. 8A">`;
}
function viewLogin(){
  const login=`<label>Class</label>${clsField("lCls")}
    <label>Roll no.</label><input type="text" id="lRoll" maxlength="10" inputmode="numeric">
    <label>4-digit PIN</label><input type="password" id="lPin" maxlength="4" inputmode="numeric" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="err" id="err">${esc(S.err)}</div><button class="btn" onclick="doLogin()">Log in</button>
    <p class="muted small">Forgot your PIN? Ask your teacher to reset it.</p>`;
  const reg=`<label>Class code <span class="muted small">(from your teacher)</span></label><input type="text" id="rCode" maxlength="20" autocapitalize="characters">
    <label>Your name</label><input type="text" id="rName" maxlength="40" placeholder="e.g. Aarav Patil">
    <div class="grid2"><div><label>Class</label>${clsField("rCls")}</div><div><label>Roll no.</label><input type="text" id="rRoll" maxlength="10" inputmode="numeric"></div></div>
    <div class="grid2"><div><label>Choose a 4-digit PIN</label><input type="password" id="rPin" maxlength="4" inputmode="numeric"></div>
    <div><label>Confirm PIN</label><input type="password" id="rPin2" maxlength="4" inputmode="numeric" onkeydown="if(event.key==='Enter')doRegister()"></div></div>
    <div class="err" id="err">${esc(S.err)}</div><button class="btn" onclick="doRegister()">Create my account</button>
    <p class="muted small">Remember your class, roll no. and PIN. You'll use them to log in on any phone or computer.</p>`;
  return `<div class="wrap narrow"><div class="hero"><div class="logo">🔬</div><h1>${esc(S.title)} – Tests &amp; Practice</h1></div>
  <div class="card"><div class="tabs"><button class="${S.tab==="login"?"on":""}" onclick="S.tab='login';S.err='';render()">Log in</button>
  <button class="${S.tab==="reg"?"on":""}" onclick="S.tab='reg';S.err='';render()">New student</button></div>
  ${S.tab==="login"?login:reg}</div>
  <p class="muted small" style="text-align:center">Your name, class, roll no. and answers are shared with your teacher.</p>
  <div class="foot"><a href="teacher.html">Teacher page</a></div></div>`;
}
function pState(p){
  const subs=p.attempts.filter(a=>a.status==="submitted"),started=p.attempts.find(a=>a.status==="started");
  return {subs,started,best:subs.length?Math.max(...subs.map(a=>a.score)):null,last:subs[subs.length-1]};
}
function paperCard(p){
  const st=pState(p);
  const badge=p.mode==="test"?`<span class="tag warn">Test${p.limit?` · ${p.limit} min`:""}</span>`:`<span class="tag pri">Practice</span>`;
  const topics=p.topics.slice(0,3).map(t=>`<span class="chip">${esc(t)}</span>`).join("")+(p.topics.length>3?`<span class="chip">+${p.topics.length-3} more</span>`:"");
  let when="";
  if(p.state==="upcoming")when=`Opens <b>${fmtD(p.opens)}</b>`;
  else if(p.state==="open"&&p.closes)when=`Closes <b>${fmtD(p.closes)}</b>`;
  else if(p.state==="closed")when=`Closed`;
  let status="",btns="";
  const local=ls.get(progKey(p.id),null);
  if(p.mode==="practice"){
    status=st.subs.length?`Best <b>${fmtN(st.best)}/${p.count}</b> · ${st.subs.length} attempt${st.subs.length>1?"s":""}`:"Not attempted yet";
    if(p.state==="open")btns+=`<button class="btn sm" onclick="openPaper('${p.id}')">${local&&Object.keys(local.answers||{}).length?"Continue":st.subs.length?"Practise again":"Start"}</button>`;
    if(st.last)btns+=`<button class="btn ghost sm" onclick="openReview('${st.last.id}')">Review last attempt</button>`;
  }else{
    if(st.subs.length){status=`Submitted · Score <b>${fmtN(st.last.score)}/${st.last.total}</b>${st.last.late?' <span class="tag bad">late</span>':""}`;
      btns+=p.canReveal?`<button class="btn ghost sm" onclick="openReview('${st.last.id}')">Review answers</button>`
        :`<span class="muted small">${p.reveal==="never"?"Answers will not be shown for this test.":"Answers will be shown after the test closes."}</span>`;}
    else if(st.started){status=`<span class="tag warn">In progress</span>`;btns+=`<button class="btn sm" onclick="openPaper('${p.id}')">Continue test</button>`;}
    else if(p.state==="open"){status="Not attempted · one attempt only";btns+=`<button class="btn sm" onclick="confirmTest('${p.id}')">Start test</button>`;}
    else status=p.state==="closed"?`<span class="tag bad">Missed</span>`:"One attempt only";
  }
  return `<div class="pcard"><div class="pc-top"><h3>${esc(p.title)}</h3>${badge}</div>
  <div class="chips">${topics}</div>
  <div class="pc-meta">${p.count} questions · ${negOf(p)?`+1 correct, −${negOf(p)} wrong`:"no negative marks"}${when?" · "+when:""}</div>
  <div class="pc-meta">${status}</div><div class="pc-btns">${btns}</div></div>`;
}
function viewHome(){
  const P=S.papers.slice().sort((a,b)=>(b.created||0)-(a.created||0));
  const open=P.filter(p=>p.state==="open"),up=P.filter(p=>p.state==="upcoming"),closed=P.filter(p=>p.state==="closed");
  const done=P.filter(p=>pState(p).subs.length);
  let got=0,tot=0;done.forEach(p=>{const s=pState(p);got+=s.subs[0].score;tot+=s.subs[0].total;});
  const pending=ls.get(OUTBOX,[]).length;
  const sec=(t,l)=>l.length?`<div class="sec">${t}</div><div class="grid">${l.map(paperCard).join("")}</div>`:"";
  return header()+`<div class="wrap"><h1>Hi ${esc(S.student.name.split(" ")[0])} 👋</h1>
  ${pending?`<div class="note">📶 ${pending} submission${pending>1?"s are":" is"} saved on this device and will be sent when you're online. <button class="btn sm" onclick="flushOutbox(true)">Send now</button></div>`:""}
  <div class="stats"><div class="stat"><span class="muted">Papers attempted</span><b>${done.length} / ${P.length}</b></div>
  <div class="stat"><span class="muted">Average (first attempts)</span><b>${tot?`<span class="pct ${pctClass(pc(got,tot))}">${pc(got,tot)}%</span>`:"—"}</b></div>
  <div class="stat"><span class="muted">Open now</span><b>${open.length}</b></div></div>
  ${P.length?sec("Open now",open)+sec("Coming up",up)+sec("Closed",closed):`<div class="card empty"><div style="font-size:42px">📚</div><h2>No papers yet</h2><div class="muted">Your teacher hasn't published any papers yet. Check back later.</div></div>`}
  <div class="foot"><a href="#" onclick="loadHome().catch(e=>notify(e.message));return false">↻ Refresh</a></div></div>`;
}

/* practice & test paper */
function qCard(k){
  const q=S.qs[k],pr=prog()||{answers:{}},v=pr.answers[k];
  if(S.paper.mode==="test"){
    const opts=q.opts.map((o,j)=>`<button class="opt ${v===j?"sel":""}" onclick="pick(${k},${j})"><span class="ol">${L[j]}</span><span>${esc(o)}</span></button>`).join("");
    return `<div class="qcard ${v!==undefined?"is-sel":""}" id="q-${k}"><div class="qhead"><span class="qn">Q${k+1}</span><span class="chip">${esc(q.topic)}</span><span class="muted small">${markTag(S.paper)}</span>
    ${v!==undefined?`<button class="btn ghost sm" style="margin-left:auto" onclick="unpick(${k})">Clear answer</button>`:""}</div>
    <div class="qtext">${esc(q.q)}</div><div class="opts">${opts}</div></div>`;
  }
  const done=v!==undefined;
  const opts=q.opts.map((o,j)=>{let c="opt";if(done)c+=j===q.ans?" right":j===v?" wrong":" dim";
    return `<button class="${c}" ${done?"disabled":""} onclick="pick(${k},${j})"><span class="ol">${L[j]}</span><span>${esc(o)}</span></button>`;}).join("");
  let fb="";
  if(done){const ok=v===q.ans;fb=`<div class="fb ${ok?"ok":"bad"}"><b>${ok?"✓ Correct! +1 mark":`✗ Wrong · ${negOf(S.paper)?"−"+negOf(S.paper)+" mark"+(negOf(S.paper)===1?"":"s"):"0 marks"}`}</b>${ok?"":` — Correct answer: <b>${L[q.ans]}. ${esc(q.opts[q.ans])}</b>`}${q.exp?`<div class="exp">${esc(q.exp)}</div>`:""}</div>`;}
  return `<div class="qcard ${done?(v===q.ans?"is-ok":"is-bad"):""}" id="q-${k}"><div class="qhead"><span class="qn">Q${k+1}</span><span class="chip">${esc(q.topic)}</span><span class="muted small">1 mark</span></div>
  <div class="qtext">${esc(q.q)}</div><div class="opts">${opts}</div>${fb}</div>`;
}
function counts(){const a=(prog()||{answers:{}}).answers;let n=0,c=0;S.qs.forEach((q,k)=>{if(a[k]!==undefined){n++;if(a[k]===q.ans)c++;}});return{n,c,w:n-c,net:c-negOf(S.paper)*(n-c)};}
function pbar(){
  const {n,c,w,net}=counts(),N=S.qs.length;
  if(S.paper.mode==="test")return `<div class="pbar-in"><div><b>${esc(S.paper.title)}</b> <span class="muted">· ${N} questions</span></div>
    <div class="pills">${S.deadline?`<span class="pill timer" id="timer">⏱ --:--</span>`:""}<span class="pill">Answered ${n}/${N}</span></div>
    <div class="row"><button class="btn sm" onclick="finish()">Submit test</button></div></div>`;
  return `<div class="pbar-in"><div><b>${esc(S.paper.title)}</b> <span class="muted">· ${N} questions</span></div>
  <div class="pills"><span class="pill">Answered ${n}/${N}</span><span class="pill ok">Correct ${c}</span><span class="pill bad">Wrong ${w}</span><span class="pill">Marks ${fmtN(net)}</span></div>
  <div class="row"><button class="btn sm" onclick="finish()">Finish &amp; submit</button></div></div>`;
}
function viewPaper(){
  const t=S.paper.mode==="test",ng=negOf(S.paper);
  const neg=ng?`<div style="margin-top:6px"><b>Marking:</b> +1 for a correct answer, <b>−${ng}</b> for a wrong answer, 0 if you skip. If you don't know an answer, it's better to skip it than to guess.</div>`:"";
  const intro=(t?`<b>Test rules:</b> one attempt only. You can change or clear an answer until you submit. Answers are not shown during the test.${S.deadline?` The test is <b>submitted automatically</b> when the timer ends.`:""}`
    :`Click an option to answer. Each answer is checked instantly and can't be changed. When all ${S.qs.length} questions are answered, your score is submitted to your teacher automatically. To skip questions, leave them and press <b>Finish &amp; submit</b>.`)+neg;
  return header()+`<div class="pbar" id="pbar">${pbar()}</div><div class="wrap"><div class="intro">${intro}</div>
  ${S.qs.map((_,k)=>qCard(k)).join("")}
  <div class="endbox"><button class="btn" onclick="finish()">${t?"Submit test":"Finish &amp; submit"}</button> <button class="btn ghost" onclick="goHome()">Back to my papers</button></div></div>`;
}
function viewReview(){
  const r=S.result,rv=r.review,qs=rv.questions;
  const list=qs.map((q,k)=>({q,k,v:rv.answers[k]})).filter(x=>!S.onlyWrong||x.v!==x.q.ans);
  const wrong=qs.filter((q,k)=>rv.answers[k]!==q.ans).length;
  const items=list.map(({q,k,v})=>{const ok=v===q.ans;
    return `<div class="qcard ${ok?"is-ok":"is-bad"}"><div class="qhead"><span class="qn">Q${k+1}</span><span class="chip">${esc(q.topic)}</span>${ok?'<span class="tag ok">Correct</span>':v>=0?'<span class="tag bad">Wrong</span>':'<span class="tag">Skipped</span>'}</div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="ans">Your answer: <span class="${ok?"ca":v>=0?"ya":"muted"}">${v>=0?L[v]+". "+esc(q.opts[v]):"Skipped"}</span></div>
    ${ok?"":`<div class="ans">Correct answer: <span class="ca">${L[q.ans]}. ${esc(q.opts[q.ans])}</span></div>`}
    ${q.exp?`<div class="fb ok" style="margin-top:8px"><div class="exp" style="margin:0">${esc(q.exp)}</div></div>`:""}</div>`;}).join("");
  return header()+`<div class="wrap"><div class="row between" style="margin-bottom:12px"><div><h1>${esc(r.paper.title)} – Review</h1>
  <div class="muted">Score <b>${fmtN(r.score)}/${r.total}</b> · ${wrong} wrong or skipped</div></div>
  <div class="row"><label class="row small" style="font-weight:600"><input type="checkbox" ${S.onlyWrong?"checked":""} onchange="S.onlyWrong=this.checked;render()"> Show wrong &amp; skipped only</label>
  <button class="btn ghost sm" onclick="goHome()">My papers</button></div></div>
  ${items||`<div class="card empty"><div style="font-size:42px">🎉</div><h2>No mistakes!</h2></div>`}</div>`;
}
function render(){
  closeModal();
  const h=S.view==="home"?viewHome():S.view==="paper"?viewPaper():S.view==="review"?viewReview():viewLogin();
  document.getElementById("app").innerHTML=h;
  if(S.view==="paper")tick();
}

/* ---------- actions ---------- */
async function doLogin(){
  const cls=$("#lCls").value.trim(),roll=$("#lRoll").value.trim(),pin=$("#lPin").value.trim();
  if(!cls||!roll||!pin){$("#err").textContent="Please fill in class, roll no. and PIN.";return;}
  try{const r=await api("login",{cls,roll,pin});S.token=r.token;ls.set(TOKEN,r.token);await loadHome();flushOutbox();}
  catch(e){$("#err").textContent=e.message;}
}
async function doRegister(){
  const v=id=>$(id).value.trim();const p1=v("#rPin"),p2=v("#rPin2");
  if(!/^\d{4}$/.test(p1)){$("#err").textContent="PIN must be exactly 4 digits.";return;}
  if(p1!==p2){$("#err").textContent="The two PINs don't match.";return;}
  try{const r=await api("register",{code:v("#rCode"),name:v("#rName"),cls:v("#rCls"),roll:v("#rRoll"),pin:p1});
    S.token=r.token;ls.set(TOKEN,r.token);await loadHome();}
  catch(e){$("#err").textContent=e.message;}
}
function logout(){stopTimer();ls.del(TOKEN);S.token=null;S.student=null;S.tab="login";S.err="";showLogin();}
function goHome(){stopTimer();S.view="home";render();window.scrollTo(0,0);loadHome().catch(()=>{});}
function confirmTest(pid){
  const p=S.papers.find(x=>x.id===pid);
  ask(`Start "${p.title}" now? You get one attempt${p.limit?` and ${p.limit} minutes. The timer keeps running even if you close the page`:""}.`,"Start test",()=>openPaper(pid));
}
async function openPaper(pid){
  try{
    const r=await api("start",{token:S.token,paperId:pid});
    S.paper=r.paper;S.qs=r.questions;S.att=r.attemptId||null;S.deadline=r.deadline||0;
    let pr=prog();
    if(S.paper.mode==="test"){if(!pr||pr.aid!==S.att)pr={aid:S.att,answers:{}};}
    else if(!pr||!pr.aid||pr.n!==S.qs.length)pr={aid:Date.now().toString(36)+Math.random().toString(36).slice(2,8),started:Date.now(),n:S.qs.length,answers:{}};
    saveProg(pr);
    S.view="paper";render();window.scrollTo(0,0);startTimer();
  }catch(e){notify(e.message);if(e.server)loadHome().catch(()=>{});}
}
function pick(k,j){
  const pr=prog();if(!pr)return;
  if(S.paper.mode==="practice"&&pr.answers[k]!==undefined)return;
  pr.answers[k]=j;saveProg(pr);
  document.getElementById("q-"+k).outerHTML=qCard(k);
  $("#pbar").innerHTML=pbar();tick();
  if(S.paper.mode==="practice"&&counts().n===S.qs.length)setTimeout(()=>submit(),700);
}
function unpick(k){const pr=prog();if(!pr||S.paper.mode!=="test")return;delete pr.answers[k];saveProg(pr);document.getElementById("q-"+k).outerHTML=qCard(k);$("#pbar").innerHTML=pbar();tick();}
function finish(){
  const {n}=counts(),N=S.qs.length;
  if(n<N)ask(`You have skipped ${N-n} question${N-n>1?"s":""} (0 marks each). Submit now?`,S.paper.mode==="test"?"Yes, submit test":"Yes, submit",submit);
  else if(S.paper.mode==="test")ask("Submit your test now? You can't change answers after this.","Submit test",submit);
  else submit();
}
let submitting=false;
async function submit(){
  if(submitting)return;submitting=true;stopTimer();
  const pr=prog(),payload={token:S.token,paperId:S.paper.id,attemptId:pr.aid,started:pr.started,answers:S.qs.map((_,k)=>pr.answers[k]===undefined?-1:pr.answers[k])};
  try{
    const r=await api("submit",payload);
    ls.del(progKey(S.paper.id));S.result=r;showResult(r);
  }catch(e){
    if(e.offline){const box=ls.get(OUTBOX,[]);box.push(payload);ls.set(OUTBOX,box);ls.del(progKey(S.paper.id));
      S.view="home";render();notify("You're offline. Your answers are saved on this device and will be sent to your teacher automatically when you're back online.");}
    else{notify(e.message);if(S.paper.mode==="test")startTimer();}
  }finally{submitting=false;}
}
function topicRows(r){
  let by={};
  if(r.review)r.review.questions.forEach((q,k)=>{const t=by[q.topic]||(by[q.topic]={n:0,c:0});t.n++;if(r.review.answers[k]===q.ans)t.c++;});
  else by=r.topics||{};
  return Object.keys(by).map(t=>`<tr><td>${esc(t)}</td><td><b>${by[t].c}/${by[t].n}</b></td></tr>`).join("");
}
function showResult(r){
  const p=pc(r.score,r.total);
  const msg=p>=90?"Outstanding! 🌟":p>=75?"Great work! 👏":p>=50?"Good effort – revise your mistakes 📘":"Keep practising – review your mistakes 💪";
  S.view="home";render();
  const ng=negOf(r.paper),brk=r.correct!==undefined?`<div class="pills" style="justify-content:center;margin:8px 0"><span class="pill ok">✓ ${r.correct} correct${ng?` (+${r.correct})`:""}</span><span class="pill bad">✗ ${r.wrong} wrong${ng&&r.wrong?` (−${fmtN(r.wrong*ng)})`:""}</span><span class="pill">${r.skipped} skipped</span></div>`:"";
  modal(`<div class="muted">${esc(r.paper.title)} – submitted ✓</div><div class="big">${fmtN(r.score)} / ${r.total}</div>${brk}
  <div style="font-size:18px;font-weight:700;margin:4px 0">${fmtN(p)}% · ${msg}</div>${r.late?'<div class="tag bad">Submitted after the time limit</div>':""}
  <table><thead><tr><th>Topic</th><th>Correct</th></tr></thead><tbody>${topicRows(r)}</tbody></table>
  ${r.review?"":`<p class="muted small">${r.hidden==="never"?"Answers are not shown for this test.":"Correct answers will be shown after the test closes."}</p>`}
  <div class="row">${r.review?`<button class="btn" onclick="S.onlyWrong=true;S.view='review';render();window.scrollTo(0,0)">Review mistakes</button>`:""}
  <button class="btn ghost" onclick="closeModal();loadHome().catch(()=>{})">Back to my papers</button></div>`);
}
async function openReview(aid){
  try{const r=await api("review",{token:S.token,attemptId:aid});S.result=r;
    if(!r.review){notify(r.hidden==="never"?"Answers are not shown for this test.":"Answers will be shown after the test closes.");return;}
    S.onlyWrong=false;S.view="review";render();window.scrollTo(0,0);}
  catch(e){notify(e.message);}
}
async function flushOutbox(loud){
  const box=ls.get(OUTBOX,[]);if(!box.length)return;
  const keep=[];let sent=0;
  for(const p of box){try{await api("submit",p,true);sent++;}catch(e){if(e.offline)keep.push(p);}}
  ls.set(OUTBOX,keep);
  if(sent&&S.view==="home")loadHome().catch(()=>{});
  if(loud&&keep.length)notify("Still offline. We'll try again automatically.");
}
window.addEventListener("online",()=>flushOutbox());

/* ---------- timer ---------- */
let tmr=null;
function startTimer(){stopTimer();if(S.paper&&S.paper.mode==="test"&&S.deadline)tmr=setInterval(tick,1000);tick();}
function stopTimer(){if(tmr)clearInterval(tmr);tmr=null;}
function tick(){
  if(!S.paper||S.paper.mode!=="test"||!S.deadline)return;
  const left=Math.max(0,S.deadline-now()),el=document.getElementById("timer");
  if(el){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=`⏱ ${m}:${String(s).padStart(2,"0")} left`;el.classList.toggle("low",left<120000);}
  if(left<=0&&S.view==="paper"&&!submitting){stopTimer();closeModal();submit();}
}

boot();
</script>
</body>
</html>
