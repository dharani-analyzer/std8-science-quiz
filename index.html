<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Std 8 Science MCQ Practice</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#1c2333;--muted:#5d6678;--line:#e2e6ef;--pri:#2456d3;--pri2:#1a44ad;--soft:#eaf0ff;--ok:#1d8648;--okbg:#e7f6ed;--bad:#c42d2d;--badbg:#fdeded;--warn:#a86a00;--warnbg:#fff4dc}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
.narrow{max-width:620px}
.top{background:var(--pri);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top .btn.ghost{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.35)}
.btn{background:var(--pri);color:#fff;border:1px solid var(--pri);border-radius:8px;padding:8px 16px;font-weight:600}
.btn:hover:not(:disabled){background:var(--pri2)}
.btn.ghost{background:#fff;color:var(--pri);border-color:#c9d5f5}
.btn.ghost:hover:not(:disabled){background:var(--soft)}
.btn.danger{background:#fff;color:var(--bad);border-color:#f0c4c4}
.btn.sm{padding:5px 12px;font-size:14px}
.btn:disabled{opacity:.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
h1{font-size:26px;margin:4px 0 6px}
h2{font-size:19px;margin:0 0 12px}
h3{margin:0;font-size:18px}
.muted{color:var(--muted)}
.hero{text-align:center;padding:26px 0 14px}
.hero .logo{font-size:44px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ubtn{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
.ubtn:hover,.ubtn.sel{border-color:var(--pri);background:var(--soft)}
.av{width:42px;height:42px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
input[type=text],input[type=password]{width:100%;padding:10px 12px;border:1px solid #cfd6e4;border-radius:8px;font:inherit;margin:4px 0 10px}
input:focus{outline:2px solid var(--pri);border-color:transparent}
label{font-weight:600;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--bad);font-weight:600;min-height:22px}
.pinbox{margin-top:16px;padding:16px;border-radius:12px;background:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pc-top{display:flex;justify-content:space-between;align-items:center}
.pc-meta{font-size:14px;color:var(--muted)}
.pc-meta b{color:var(--ink)}
.pc-btns{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:#eef0f4;color:var(--muted)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.bar{height:8px;background:#e9edf4;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.pct{font-weight:700}
.pct.ok{color:var(--ok)}.pct.warn{color:var(--warn)}.pct.bad{color:var(--bad)}
.pbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(20,30,60,.06)}
.pbar-in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:14px;font-weight:600;padding:4px 12px;border-radius:20px;background:#eef0f4}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pbtns{display:flex;gap:8px}
.qcard{background:#fff;border:1px solid var(--line);border-left:5px solid #cfd6e4;border-radius:12px;padding:16px 18px;margin-bottom:14px}
.qcard.is-ok{border-left-color:var(--ok)}
.qcard.is-bad{border-left-color:var(--bad)}
.qhead{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.qn{font-weight:800;color:var(--pri)}
.chip{font-size:12px;background:var(--soft);color:var(--pri2);padding:2px 10px;border-radius:20px;font-weight:600}
.qtext{font-weight:600;font-size:17px;margin-bottom:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:640px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fafbfd;border:1.5px solid #d9dfea;border-radius:10px;padding:10px 12px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--pri);background:var(--soft)}
.ol{font-weight:800;min-width:20px;color:var(--muted)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.right .ol{color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt.wrong .ol{color:var(--bad)}
.opt.dim{opacity:.6}
.opt:disabled{color:var(--ink)}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--okbg);color:#14532d}
.fb.bad{background:var(--badbg);color:#7f1d1d}
.exp{margin-top:4px;color:var(--ink)}
.exp:before{content:"💡 "}
.intro{background:var(--soft);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px}
.endbox{text-align:center;padding:10px 0}
.modal-bg{position:fixed;inset:0;background:rgba(15,22,40,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;max-height:90vh;overflow:auto;text-align:center}
.big{font-size:54px;font-weight:800;color:var(--pri);line-height:1.1}
.modal table{margin:14px 0;text-align:left}
.modal .row{justify-content:center}
.rc{background:#fff;border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:12px;padding:14px 18px;margin-bottom:12px}
.rc .ans{margin-top:6px;font-size:15px}
.rc .ya{color:var(--bad);font-weight:600}
.rc .ca{color:var(--ok);font-weight:600}
.empty{text-align:center;padding:40px 10px}
.small{font-size:14px}
a.link{color:var(--bad);cursor:pointer;font-size:14px;text-decoration:underline}
</style>
</head>
<body>
<div id="app"></div>

["Why are viruses not included in the five kingdom system?","They show signs of life only inside a host cell","They are very large in size","They are multicellular","They make their own food","Outside a host cell viruses behave like non-living crystals; they reproduce only inside living cells, so they do not fit any kingdom."],

// ---------- Chapter 2 ----------
[
["According to WHO, health means ____.","Physical, mental and social well-being","Only absence of disease","Only physical fitness","Having a strong body","WHO defines health as complete physical, mental and social well-being, not merely the absence of disease."],

["The walls of a dam are made thicker at the bottom because ____.","Liquid pressure increases with depth","Liquid pressure decreases with depth","Water is lighter at the bottom","It looks attractive","Water pressure is greatest at the bottom, so the walls must be strongest there."],

/* ---------- build papers ---------- */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const ALL=[];
BANK.forEach((qs,ci)=>qs.forEach((r,qi)=>{
  const id="c"+(ci+1)+"q"+(qi+1);
  const raw=[r[1],r[2],r[3],r[4]];const order=[0,1,2,3];const R=rng(hashStr(id));
  for(let i=3;i>0;i--){const j=Math.floor(R()*(i+1));const t=order[i];order[i]=order[j];order[j]=t;}
  ALL.push({id,ch:ci+1,q:r[0],opts:order.map(k=>raw[k]),ans:order.indexOf(0),exp:r[5]});
}));
const NPAPERS=10, PER=20;
const PAPERS=Array.from({length:NPAPERS},(_,p)=>ALL.filter((_,i)=>i%NPAPERS===p));

/* ---------- storage ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){if(!store.warned){store.warned=true;setTimeout(()=>notify("Progress could not be saved in this browser, so it will be lost when the page is closed. Please open the file directly in Chrome, Edge or Firefox."),0);}return false;}},
  del(k){try{localStorage.removeItem(k);}catch(e){}}
};
const USERS_KEY=APP+"_users", MAX_USERS=10;
const users=()=>store.get(USERS_KEY,[]);
const dataKey=n=>APP+"_data_"+n.toLowerCase();
const pinHash=(n,p)=>hashStr(APP+"|"+n.toLowerCase()+"|"+p).toString(36);
let cur=null, D=null, view="login", arg=null, pickIdx=null;
function loadData(){D=store.get(dataKey(cur),{papers:{}});}
function save(){store.set(dataKey(cur),D);}
function P(i){return D.papers[i]||(D.papers[i]={answers:{},finished:false,attempts:[]});}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const L="ABCD";
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function scoreOf(i){const p=P(i);let s=0,a=0;PAPERS[i].forEach(q=>{if(q.id in p.answers){a++;if(p.answers[q.id]===q.ans)s++;}});return{s,a};}
function best(i){const at=P(i).attempts;return at.length?Math.max(...at.map(x=>x.score)):null;}
function mistakes(i){const p=P(i);return PAPERS[i].filter(q=>{const v=p.answers[q.id];return v===undefined?p.finished:v!==q.ans;});}
function pctClass(p){return p>=80?"ok":p>=50?"warn":"bad";}

/* ---------- views ---------- */
function header(){
  return `<header class="top"><div class="brand">🔬 Std 8 Science · MCQ Practice</div>
  <div class="who"><span>👤 ${esc(cur)}</span>
  <button class="btn ghost sm" onclick="go('dash')">Dashboard</button>
  <button class="btn ghost sm" onclick="logout()">Log out</button></div></header>`;
}

  const us=users();
  const ubtns=us.length?`<div class="users">${us.map((u,k)=>`<button class="ubtn ${pickIdx===k?"sel":""}" onclick="selectUser(${k})"><span class="av">${esc(u.name.charAt(0).toUpperCase())}</span><span>${esc(u.name)}</span></button>`).join("")}</div>`
    :`<p class="muted">No students yet. Create the first account below.</p>`;
  let pinbox="";
  if(pickIdx!==null&&us[pickIdx]){
    pinbox=`<div class="pinbox"><label>Enter 4-digit PIN for <b>${esc(us[pickIdx].name)}</b></label>

  <div class="row"><button class="btn ghost sm" onclick="exportData()">⬇ Download backup</button>
  <label class="btn ghost sm" style="font-weight:600">⬆ Restore backup<input type="file" accept=".json" style="display:none" onchange="importData(this.files[0])"></label></div></div>
  </div>`;
}

function viewDash(){
  let done=0,bestSum=0,att=0,cor=0;
  const cards=PAPERS.map((qs,i)=>{
    const p=P(i);const {s,a}=scoreOf(i);att+=a;cor+=s;const b=best(i);
    if(p.finished)done++; if(b!==null)bestSum+=b;
    const status=p.finished?`<span class="tag ok">Completed</span>`:a?`<span class="tag warn">In progress</span>`:`<span class="tag">Not started</span>`;
    const m=mistakes(i).length;
    return `<div class="pcard"><div class="pc-top"><h3>Paper ${i+1}</h3>${status}</div>
    <div class="bar"><i style="width:${a/PER*100}%"></i></div>
    <div class="pc-meta">Answered <b>${a}/${PER}</b> · Score <b>${s}/${PER}</b>${b!==null?` · Best <b>${b}/${PER}</b>`:""}${p.attempts.length?` · Attempts <b>${p.attempts.length}</b>`:""}</div>
    <div class="pc-btns"><button class="btn sm" onclick="go('paper',${i})">${p.finished?"Review":a?"Continue":"Start"}</button>
    <button class="btn ghost sm" onclick="go('recap',${i})" ${m?"":"disabled"}>Recap mistakes${m?` (${m})`:""}</button>
    ${p.finished?`<button class="btn ghost sm" onclick="retake(${i})">Retake</button>`:""}</div></div>`;
  }).join("");
  const rows=CHAPTERS.map((n,ci)=>{
    let t=0,c=0,tot=0;
    PAPERS.forEach((qs,i)=>{const p=P(i);qs.forEach(q=>{if(q.ch!==ci+1)return;tot++;if(q.id in p.answers){t++;if(p.answers[q.id]===q.ans)c++;}});});
    const pc=t?Math.round(c/t*100):null;
    return `<tr><td><b>${ci+1}.</b> ${esc(n)}</td><td>${t}/${tot}</td><td>${c}</td><td>${pc===null?'<span class="muted">—</span>':`<span class="pct ${pctClass(pc)}">${pc}%</span>`}</td></tr>`;
  }).join("");
  const totalMist=PAPERS.reduce((s,_,i)=>s+mistakes(i).length,0);
  const acc=att?Math.round(cor/att*100):0;
  save();
  return header()+`<div class="wrap">
  <h1>Hi ${esc(cur)} 👋</h1><div class="muted">Pick a paper. Each answer is checked instantly – 1 mark per correct answer.</div>
  <div class="stats">
   <div class="stat"><span class="muted">Papers completed</span><b>${done} / ${NPAPERS}</b></div>
   <div class="stat"><span class="muted">Total of best scores</span><b>${bestSum} / ${NPAPERS*PER}</b></div>
   <div class="stat"><span class="muted">Overall accuracy</span><b>${att?acc+"%":"—"}</b></div>
   <div class="stat"><span class="muted">Mistakes to revise</span><b>${totalMist}</b><button class="btn sm" style="margin-top:6px" onclick="go('recap','all')" ${totalMist?"":"disabled"}>Recap all mistakes</button></div>
  </div>
  <div class="grid">${cards}</div>
  <div class="card" style="margin-top:22px"><h2>Chapter-wise performance</h2>
  <p class="muted small" style="margin-top:-6px">Based on your current answers in all papers. Chapters below 50% need more revision.</p>
  <table><thead><tr><th>Chapter</th><th>Attempted</th><th>Correct</th><th>Accuracy</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

function qCard(i,k){
  const q=PAPERS[i][k];const p=P(i);const v=p.answers[q.id];const done=v!==undefined;const locked=done||p.finished;
  const opts=q.opts.map((o,j)=>{
    let cls="opt";
    if(done){cls+=j===q.ans?" right":j===v?" wrong":" dim";}
    else if(p.finished&&j===q.ans)cls+=" right";
    return `<button class="${cls}" ${locked?"disabled":""} onclick="answer(${i},${k},${j})"><span class="ol">${L[j]}</span><span>${esc(o)}</span></button>`;
  }).join("");
  let fb="";
  const corr=`Correct answer: <b>${L[q.ans]}. ${esc(q.opts[q.ans])}</b>`;
  if(done){const ok=v===q.ans;fb=`<div class="fb ${ok?"ok":"bad"}"><b>${ok?"✓ Correct! +1 mark":"✗ Wrong · 0 marks"}</b>${ok?"":" — "+corr}<div class="exp">${esc(q.exp)}</div></div>`;}
  else if(p.finished){fb=`<div class="fb bad"><b>Not answered · 0 marks</b> — ${corr}<div class="exp">${esc(q.exp)}</div></div>`;}
  return `<div class="qcard ${done?(v===q.ans?"is-ok":"is-bad"):(p.finished?"is-bad":"")}" id="q-${k}">
  <div class="qhead"><span class="qn">Q${k+1}</span><span class="chip">Ch ${q.ch} · ${esc(CHAPTERS[q.ch-1])}</span><span class="muted small">1 mark</span></div>
  <div class="qtext">${esc(q.q)}</div><div class="opts">${opts}</div>${fb}</div>`;
}
function pbar(i){
  const {s,a}=scoreOf(i);const p=P(i);
  return `<div class="pbar-in"><div><b>Paper ${i+1}</b> <span class="muted">· ${PER} questions · 1 mark each</span></div>
  <div class="pills"><span class="pill">Answered ${a}/${PER}</span><span class="pill ok">Marks ${s}</span><span class="pill bad">Wrong ${a-s}</span></div>
  <div class="pbtns"><button class="btn ghost sm" onclick="go('recap',${i})">Recap mistakes</button>
  ${p.finished?`<button class="btn sm" onclick="showResult(${i})">View total</button>`:`<button class="btn sm" onclick="finish(${i})">Finish &amp; see total</button>`}</div></div>`;
}
function viewPaper(i){
  const p=P(i);
  const qs=PAPERS[i].map((_,k)=>qCard(i,k)).join("");
  const intro=p.finished
    ?`This paper is completed. You can review all answers below, check your mistakes with <b>Recap mistakes</b>, or <a class="link" style="color:var(--pri)" onclick="retake(${i})">retake the paper</a>.`
    :`Click an option to answer. Your answer is checked instantly and the correct answer is shown. Answers cannot be changed once selected. When all ${PER} questions are answered, your total is shown automatically.`;
  return header()+`<div class="pbar" id="pbar">${pbar(i)}</div><div class="wrap"><div class="intro">${intro}</div>${qs}
  <div class="endbox">${p.finished?`<button class="btn" onclick="showResult(${i})">View total score</button>`:`<button class="btn" onclick="finish(${i})">Finish &amp; see total score</button>`}
  <button class="btn ghost" onclick="go('dash')">Back to dashboard</button></div></div>`;
}

function viewRecap(i){
  const list=i==="all"?PAPERS.flatMap((qs,pi)=>mistakes(pi).map(q=>({q,pi}))):mistakes(i).map(q=>({q,pi:i}));
  const title=i==="all"?"Recap – all mistakes":`Recap – Paper ${i+1} mistakes`;
  const items=list.map(({q,pi})=>{
    const v=P(pi).answers[q.id];const k=PAPERS[pi].indexOf(q)+1;
    return `<div class="rc"><div class="qhead"><span class="qn">Paper ${pi+1} · Q${k}</span><span class="chip">Ch ${q.ch} · ${esc(CHAPTERS[q.ch-1])}</span></div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="ans">Your answer: <span class="ya">${v===undefined?"Not answered":L[v]+". "+esc(q.opts[v])}</span></div>
    <div class="ans">Correct answer: <span class="ca">${L[q.ans]}. ${esc(q.opts[q.ans])}</span></div>
    <div class="fb ok" style="margin-top:8px"><div class="exp" style="margin:0">${esc(q.exp)}</div></div></div>`;
  }).join("");
  const back=i==="all"?"":`<button class="btn ghost sm" onclick="go('paper',${i})">Back to paper</button>`;
  return header()+`<div class="wrap"><div class="row" style="justify-content:space-between;margin-bottom:12px">
  <div><h1>${title}</h1><div class="muted">${list.length} question${list.length===1?"":"s"} to revise. Read the explanation for each one.</div></div>
  <div class="row">${back}<button class="btn ghost sm" onclick="go('dash')">Dashboard</button></div></div>
  ${list.length?items:`<div class="card empty"><div style="font-size:42px">🎉</div><h2>No mistakes here!</h2><div class="muted">Answered questions are all correct so far.</div></div>`}</div>`;
}

/* ---------- actions ---------- */
function go(v,a){view=v;arg=a;render();window.scrollTo(0,0);}
function render(){
  closeModal();
  let h;
  if(!cur)h=viewLogin();else if(view==="paper")h=viewPaper(arg);else if(view==="recap")h=viewRecap(arg);else h=viewDash();
  document.getElementById("app").innerHTML=h;
}
function answer(i,k,j){
  const p=P(i);if(p.finished)return;const q=PAPERS[i][k];if(q.id in p.answers)return;
  p.answers[q.id]=j;save();
  document.getElementById("q-"+k).outerHTML=qCard(i,k);
  $("#pbar").innerHTML=pbar(i);
  if(scoreOf(i).a===PER)finish(i,true);
}
function finish(i,auto){
  const p=P(i);if(p.finished){showResult(i);return;}
  const {s,a}=scoreOf(i);
  if(!auto&&a<PER){ask(`You have ${PER-a} unanswered question(s). They will get 0 marks. Finish the paper now?`,"Yes, finish",()=>doFinish(i));return;}
  doFinish(i);
}
function doFinish(i){
  const p=P(i);if(p.finished){showResult(i);return;}
  const {s}=scoreOf(i);
  p.finished=true;p.attempts.push({score:s,date:Date.now()});save();
  const y=window.scrollY;render();window.scrollTo(0,y);showResult(i);
}
function showResult(i){
  const {s}=scoreOf(i);const pct=Math.round(s/PER*100);
  const msg=pct>=90?"Outstanding! 🌟":pct>=75?"Great work! 👏":pct>=50?"Good effort – revise your mistakes 📘":"Keep practising – use the recap to revise 💪";
  const p=P(i);const by={};
  PAPERS[i].forEach(q=>{by[q.ch]=by[q.ch]||{t:0,c:0};by[q.ch].t++;if(p.answers[q.id]===q.ans)by[q.ch].c++;});
  const rows=Object.keys(by).map(ch=>`<tr><td>Ch ${ch} · ${esc(CHAPTERS[ch-1])}</td><td><b>${by[ch].c}/${by[ch].t}</b></td></tr>`).join("");
  const b=best(i);const m=mistakes(i).length;
  closeModal();
  document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal">
  <div class="muted">Paper ${i+1} – Total score</div><div class="big">${s} / ${PER}</div>
  <div style="font-size:18px;font-weight:700;margin:4px 0">${pct}% · ${msg}</div>
  <div class="muted small">Best score: ${b}/${PER} · Attempts: ${p.attempts.length}</div>
  <table><thead><tr><th>Chapter</th><th>Marks</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="row"><button class="btn" onclick="go('recap',${i})" ${m?"":"disabled"}>Recap mistakes${m?` (${m})`:""}</button>
  <button class="btn ghost" onclick="retake(${i})">Retake</button>
  <button class="btn ghost" onclick="go('dash')">Dashboard</button>
  <button class="btn ghost" onclick="closeModal()">Close</button></div></div></div>`);
}
function closeModal(){const m=document.getElementById("modal");if(m)m.remove();closeDlg();}
function closeDlg(){const d=document.getElementById("dlg");if(d)d.remove();}
let dlgOk=null;
function ask(msg,okLabel,onOk){
  closeDlg();dlgOk=onOk;
  document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="dlg" style="z-index:60"><div class="modal" style="max-width:420px">
  <div style="font-size:17px;font-weight:600;margin-bottom:16px">${esc(msg)}</div>
  <div class="row"><button class="btn" id="dlgOk" onclick="const f=dlgOk;closeDlg();if(f)f();">${esc(okLabel||"OK")}</button>
  <button class="btn ghost" onclick="closeDlg()">Cancel</button></div></div></div>`);
  document.getElementById("dlgOk").focus();
}
function notify(msg){
  closeDlg();
  document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="dlg" style="z-index:60"><div class="modal" style="max-width:420px">
  <div style="font-size:17px;font-weight:600;margin-bottom:16px">${esc(msg)}</div>
  <div class="row"><button class="btn" onclick="closeDlg()">OK</button></div></div></div>`);
}
function retake(i){
  ask(`Retake Paper ${i+1}? Your current answers will be cleared (your best score is kept).`,"Yes, retake",()=>{
    const p=P(i);p.answers={};p.finished=false;save();go("paper",i);});
}
function selectUser(k){pickIdx=k;render();setTimeout(()=>{const e=$("#pin");if(e)e.focus();},0);}
function doLogin(){
  const u=users()[pickIdx];const pin=$("#pin").value.trim();
  if(u&&u.pin===pinHash(u.name,pin)){
    cur=u.name;pickIdx=null;try{sessionStorage.setItem(APP+"_cur",cur);}catch(e){}
    loadData();go("dash");
  }else{$("#loginErr").textContent="Wrong PIN. Please try again.";$("#pin").value="";}
}
function createUser(){
  const name=$("#nName").value.trim().replace(/\s+/g," ");const p1=$("#nPin").value.trim(),p2=$("#nPin2").value.trim();
  const err=t=>{$("#newErr").textContent=t;};
  const us=users();
  if(!name)return err("Please enter a name.");
  if(us.length>=MAX_USERS)return err("Maximum 10 students reached.");
  if(us.some(u=>u.name.toLowerCase()===name.toLowerCase()))return err("A student with this name already exists.");
  if(!/^\d{4}$/.test(p1))return err("PIN must be exactly 4 digits.");
  if(p1!==p2)return err("The two PINs do not match.");
  us.push({name,pin:pinHash(name,p1),created:Date.now()});
  if(!store.set(USERS_KEY,us))return;
  cur=name;try{sessionStorage.setItem(APP+"_cur",cur);}catch(e){}
  loadData();save();go("dash");
}
function removeUser(){
  const us=users();const u=us[pickIdx];if(!u)return;
  const pin=$("#pin").value.trim();
  if(u.pin!==pinHash(u.name,pin)){$("#loginErr").textContent="Type this student's PIN above first, then click Remove.";return;}
  const k=pickIdx;
  ask(`Remove ${u.name} and delete all their progress? This cannot be undone.`,"Yes, remove",()=>{
    us.splice(k,1);store.set(USERS_KEY,us);store.del(dataKey(u.name));pickIdx=null;render();});
}
function logout(){cur=null;D=null;view="login";try{sessionStorage.removeItem(APP+"_cur");}catch(e){}render();}
function exportData(){
  const us=users();const out={app:APP,v:1,saved:new Date().toISOString(),users:us,data:{}};
  us.forEach(u=>out.data[u.name]=store.get(dataKey(u.name),{papers:{}}));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:"application/json"}));
  a.download="std8-science-backup.json";document.body.appendChild(a);a.click();a.remove();
}
function importData(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
    const o=JSON.parse(r.result);if(o.app!==APP||!Array.isArray(o.users))throw 0;
    ask("Restoring will replace all current students and progress on this computer with the backup. Continue?","Yes, restore",()=>{
    users().forEach(u=>store.del(dataKey(u.name)));
    const us=o.users.slice(0,MAX_USERS);store.set(USERS_KEY,us);
    us.forEach(u=>store.set(dataKey(u.name),(o.data&&o.data[u.name])||{papers:{}}));
    pickIdx=null;render();notify("Backup restored.");});
  }catch(e){notify("This is not a valid backup file.");}};
  r.readAsText(f);
}

/* ---------- start ---------- */
(function init(){
  try{const s=sessionStorage.getItem(APP+"_cur");if(s&&users().some(u=>u.name===s)){cur=s;loadData();view="dash";}}catch(e){}
  render();
})();
</script>
</body>
